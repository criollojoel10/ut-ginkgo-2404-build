image: ubuntu:20.04
variables:
  DEV_TARBALL_VARIANT: _usrmerge
  OTA_CHANNEL: "24.04-1.x/arm64/android9plus/stable"
  ROOTFS_URL: "https://ci.ubports.com/job/ubuntu-touch-rootfs/job/ubports%252F24.04-1.x/lastSuccessfulBuild/artifact/ubuntu-touch-android9plus-rootfs-arm64.tar.gz"
  deviceinfo_ubuntu_touch_release: "24.04-1.x"
build:
  stage: build
  script:
    - apt update
    - apt install android-tools-mkbootimg bc bison build-essential ca-certificates cpio curl flex git kmod libssl-dev libtinfo5 python2 sudo unzip wget xz-utils -y --no-install-recommends
    - ln -sf python2.7 /usr/bin/python
    - wget https://raw.githubusercontent.com/LineageOS/android_system_core/lineage-17.1/mkbootimg/mkbootimg.py -O /usr/bin/mkbootimg
    - git clone https://gitlab.com/ubports/community-ports/halium-generic-adaptation-build-tools build
    - ./build/build.sh
  artifacts:
    paths:
      - out/*

flashable:
  stage: deploy
  script:
    - apt update
    - apt install -y git img2simg jq sudo wget xz-utils
    - git clone https://gitlab.com/ubports/community-ports/halium-generic-adaptation-build-tools build
    - DEVICE="$(source deviceinfo && echo $deviceinfo_codename)"
    - ./build/fetch-and-prepare-latest-ota.sh "$OTA_CHANNEL" "$DEVICE" ota
    - mkdir -p out
    - ./build/system-image-from-ota.sh ota/ubuntu_command out
  artifacts:
    paths:
      - out/boot.img
      - out/system.img
  when: manual

devel-flashable:
  stage: deploy
  script:
    - apt update
    - apt install -y git img2simg jq sudo wget xz-utils zip
    - rm -rf "workdir/downloads/KERNEL_OBJ"
    - rm -rf "/builds/areyoudeveloper/xiaomi-ginkgo-willow/workdir/downloads/ut_kernel_xiaomi_sm6125"
    - git clone https://gitlab.com/ubports/community-ports/halium-generic-adaptation-build-tools build
    - DEVICE="$(source deviceinfo && echo $deviceinfo_codename)"
    - ./build/prepare-fake-ota.sh out/device_${DEVICE}${DEV_TARBALL_VARIANT}.tar.xz ota
    - mkdir -p out
    - ./build/system-image-from-ota.sh ota/ubuntu_command out
    # - apt install -y zstd
    # - zstd -15 -T0 out/system.img
    # - zstd -15 -T0 out/rootfs.img
    - git clone https://github.com/erfanoabdi/ubport_GSI.git out/ubport_GSI
    - cp out/rootfs.img out/ubport_GSI/data/
    - cp out/system.img out/ubport_GSI/data/
    - cd out/ubport_GSI
    - zip -r9 ubport_GSI.zip * -x .git README.md data
    - rm -f out/system.img out/rootfs.img
  artifacts:
    paths:
      # - out/boot.img
      # - out/system.img.zst
      # - out/dtbo.img
      # - out/rootfs.img.zst
      - out/ubport_GSI/ubport_GSI.zip
