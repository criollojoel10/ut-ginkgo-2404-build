name: build-ut-24.04-ginkgo

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      ADAPTATION_TOOLS_BRANCH: main
      DEV_TARBALL_VARIANT: _usrmerge
      ROOTFS_URL: https://ci.ubports.com/job/ubuntu-touch-rootfs/job/ubports%252F24.04-1.x/lastSuccessfulBuild/artifact/ubuntu-touch-android9plus-rootfs-arm64.tar.gz
      OTA_CHANNEL: 24.04-1.x/arm64/android9plus/stable

    steps:
      - uses: actions/checkout@v4

      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-tools-mkbootimg bc bison build-essential ca-certificates cpio \
            curl e2fsprogs fakeroot flex git jq kmod libssl-dev libtinfo5 lz4 \
            python2 python3 sudo unzip wget xz-utils zstd
          sudo apt-get install -y --no-install-recommends img2simg || \
            sudo apt-get install -y --no-install-recommends android-sdk-libsparse-utils
          sudo ln -sf python2 /usr/bin/python
          sudo wget -q https://raw.githubusercontent.com/LineageOS/android_system_core/lineage-17.1/mkbootimg/mkbootimg.py -O /usr/bin/mkbootimg
          sudo chmod +x /usr/bin/mkbootimg
          command -v mkbootimg img2simg mkfs.ext4 zstd

      - name: Pre-descarga con aria2c
        run: |
          sudo apt-get install -y --no-install-recommends aria2
          mkdir -p ota
          source deviceinfo
          HAL_URL="https://ci.ubports.com/job/UBportsCommunityPortsJenkinsCI/job/ubports%252Fporting%252Fcommunity-ports%252Fjenkins-ci%252Fgeneric_arm64/job/halium-${deviceinfo_halium_version}.0/lastSuccessfulBuild/artifact/halium_halium_arm64.tar.xz"
          aria2c -x16 -s16 -k1M -j2 --file-allocation=none --summary-interval=0 \
            --console-log-level=warn --dir=ota "$ROOTFS_URL" "$HAL_URL"

      - name: Compilar kernel y device tarball
        run: ./build.sh

      - name: Generar imagen flasheable
        run: |
          set -x
          DEVICE="$(source deviceinfo && echo $deviceinfo_codename)"
          ./build/prepare-fake-ota.sh "out/device_${DEVICE}${DEV_TARBALL_VARIANT}.tar.xz" ota
          ./build/system-image-from-ota.sh ota/ubuntu_command out
          ls -lh out

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: ut2404-ginkgo
          path: |
            out/*.img
            out/*.zst
          retention-days: 14
          if-no-files-found: error
